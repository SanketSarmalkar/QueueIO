{% extends "base.html" %}
{% load static %}

{% block head_extra %}
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
{% endblock %}

{% block body %}
<header class="h-14 bg-slate-900 border-b border-slate-800 sticky top-0 z-50 flex items-center px-4 md:px-6 justify-between">
    <div class="flex items-center gap-3">
        <a href="/" class="flex items-center gap-3 group" aria-label="Back to Dashboard">
            <img src="{% static 'favicon.png' %}" alt="Queuei" class="w-9 h-9 rounded-lg object-cover border border-slate-700/50">
            <span class="font-black tracking-tighter text-lg uppercase text-white hidden sm:block">
                Queue <span class="text-indigo-400">IO</span>
            </span>
        </a>
    </div>

    <nav class="flex items-center gap-2 md:gap-6" aria-label="Admin navigation">
        <div class="flex items-center gap-0.5 md:gap-1">
            <a href="/"
               class="px-2 md:px-3 py-1.5 rounded text-[10px] font-bold uppercase text-slate-400 hover:text-white hover:bg-slate-800 transition-all flex items-center gap-1.5"
               aria-label="Dashboard">
                <i class="fa-solid fa-house text-[9px]" aria-hidden="true"></i>
                <span class="hidden md:inline">Dashboard</span>
            </a>
            <a href="{% url 'cron_manager' %}"
               class="px-2 md:px-3 py-1.5 rounded text-[10px] font-bold uppercase transition-all flex items-center gap-1.5
                      {% block nav_cron_class %}text-slate-400 hover:text-white hover:bg-slate-800{% endblock %}"
               aria-label="Cron Manager">
                <i class="fa-solid fa-clock text-[9px]" aria-hidden="true"></i>
                <span class="hidden md:inline">Cron</span>
            </a>
            <a href="{% url 'settings' %}"
               class="px-2 md:px-3 py-1.5 rounded text-[10px] font-bold uppercase transition-all flex items-center gap-1.5
                      {% block nav_settings_class %}text-slate-400 hover:text-white hover:bg-slate-800{% endblock %}"
               aria-label="Settings">
                <i class="fa-solid fa-sliders text-[9px]" aria-hidden="true"></i>
                <span class="hidden md:inline">Settings</span>
            </a>
        </div>

        <a href="{% url 'logout' %}"
           class="flex items-center gap-1.5 text-slate-400 hover:text-red-400 transition-colors text-[10px] font-mono uppercase border-l border-slate-700 pl-3 md:pl-6"
           aria-label="Logout">
            <i class="fa-solid fa-power-off" aria-hidden="true"></i>
            <span class="hidden md:inline">Logout</span>
        </a>
    </nav>
</header>

<!-- Toast notification -->
<div x-show="toast" x-transition
     role="alert" aria-live="polite"
     :class="toast && toast.type === 'error'
         ? 'bg-red-900/90 border-red-700 text-red-200'
         : 'bg-emerald-900/90 border-emerald-700 text-emerald-200'"
     class="fixed top-4 right-4 z-50 border px-5 py-3 rounded-xl text-xs font-bold shadow-2xl backdrop-blur-sm"
     x-text="toast ? toast.msg : ''">
</div>

<main class="{% block main_class %}max-w-3xl mx-auto px-4 md:px-6 py-6 md:py-10{% endblock %}">
    {% block content %}{% endblock %}
</main>

{% block scripts %}{% endblock %}
{% endblock %}
