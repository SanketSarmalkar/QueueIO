<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Login | Queue IO</title>
</head>
<body class="bg-slate-950 h-screen flex items-center justify-center font-sans">
    
    <div class="w-full max-w-md p-8 bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl">
        <div class="text-center mb-8">
            <div class="bg-indigo-600 w-12 h-12 rounded-lg flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-shield-halved text-white text-xl"></i>
            </div>
            <h1 class="text-white text-2xl font-black uppercase tracking-tighter">Queue <span class="text-indigo-400">Auth</span></h1>
            <p class="text-slate-500 text-[10px] mt-2 uppercase tracking-widest font-mono">Restricted Access Terminal</p>
        </div>

        <form method="post" class="space-y-6" x-data="{ showPassword: false }">
            {% csrf_token %}
            
            <div>
                <label class="text-slate-400 text-[10px] font-bold uppercase mb-2 block">Ident-String</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-4 top-4 text-slate-500 text-sm"></i>
                    <input type="text" name="username" required 
                           class="w-full bg-slate-800 border border-slate-700 rounded-lg pl-11 pr-4 py-3 text-white outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                </div>
            </div>

            <div>
                <label class="text-slate-400 text-[10px] font-bold uppercase mb-2 block">Access-Key</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-4 text-slate-500 text-sm"></i>
                    
                    <input :type="showPassword ? 'text' : 'password'" name="password" required 
                           class="w-full bg-slate-800 border border-slate-700 rounded-lg pl-11 pr-12 py-3 text-white outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                    
                    <button type="button" @click="showPassword = !showPassword" 
                            class="absolute right-4 top-3.5 text-slate-500 hover:text-indigo-400 transition-colors">
                        <i class="fa-solid" :class="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-lg transition-all uppercase tracking-widest text-sm shadow-lg shadow-indigo-500/20">
                Initialize Session
            </button>

            <div class="mt-6 flex flex-col items-center gap-4">
                <div class="flex items-center w-full gap-4">
                    <div class="h-[1px] bg-slate-800 flex-1"></div>
                    <span class="text-slate-600 text-[9px] uppercase font-mono tracking-widest">OR</span>
                    <div class="h-[1px] bg-slate-800 flex-1"></div>
                </div>
                
                <a href="{% url 'signup' %}" class="w-full text-center border border-slate-700 hover:border-indigo-500 text-slate-400 hover:text-indigo-400 font-bold py-3 rounded-lg transition-all uppercase tracking-widest text-sm">
                    Register New Ident
                </a>
            </div>

            {% if form.errors %}
                <p class="text-red-400 text-center text-xs font-mono uppercase mt-4">Invalid Credentials</p>
            {% endif %}
        </form>
    </div>

</body>
</html>
