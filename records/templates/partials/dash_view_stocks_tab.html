<template x-if="viewMode === 'stocks_tab'">
    <div class="flex-1 overflow-y-auto custom-scrollbar pb-24 md:pb-0">
        <div class="max-w-6xl mx-auto px-4 md:px-8 py-6 md:py-10">

            <!-- Header -->
            <div class="flex items-start justify-between mb-8 gap-4 flex-wrap">
                <div>
                    <h1 class="text-2xl md:text-3xl font-black text-slate-800 dark:text-slate-100 tracking-tight">NASDAQ-100 Scorecard</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-500 mt-1 font-mono">
                        4-pillar decision scores · refreshed daily at 09:00 IST
                        <template x-if="stocksData && stocksData.generated">
                            <span> · generated <span x-text="new Date(stocksData.generated).toLocaleString()"></span></span>
                        </template>
                    </p>
                </div>
                <button @click="stocksData = null; loadStocks()"
                        class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-[10px] font-bold uppercase text-slate-500 hover:text-slate-200 hover:bg-slate-800 transition-all border border-slate-200 dark:border-slate-800"
                        aria-label="Reload latest snapshot">
                    <i class="fa-solid fa-rotate text-[9px]" :class="stocksLoading && 'animate-spin'" aria-hidden="true"></i>
                    Reload
                </button>
            </div>

            <!-- Loading -->
            <template x-if="stocksLoading">
                <div class="space-y-4 animate-pulse" role="status" aria-label="Loading stock data">
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="h-24 bg-slate-100 dark:bg-slate-800 rounded-2xl"></div>
                        <div class="h-24 bg-slate-100 dark:bg-slate-800 rounded-2xl"></div>
                        <div class="h-24 bg-slate-100 dark:bg-slate-800 rounded-2xl"></div>
                        <div class="h-24 bg-slate-100 dark:bg-slate-800 rounded-2xl"></div>
                    </div>
                    <div class="h-96 bg-slate-100 dark:bg-slate-800 rounded-2xl"></div>
                </div>
            </template>

            <!-- Empty / no snapshot yet -->
            <template x-if="!stocksLoading && stocksData && (stocksData.empty || !(stocksData.rows && stocksData.rows.length))">
                <div class="text-center py-24">
                    <i class="fa-solid fa-chart-line text-4xl text-slate-300 dark:text-slate-700 mb-4" aria-hidden="true"></i>
                    <p class="text-sm font-bold text-slate-500 dark:text-slate-400">No scorecard yet</p>
                    <p class="text-xs text-slate-400 dark:text-slate-600 mt-1 font-mono">
                        The first snapshot is generated by the daily 9 AM job.
                        Superusers can trigger it now from the Command Center → "NASDAQ Stock Refresh".
                    </p>
                </div>
            </template>

            <!-- Content -->
            <template x-if="!stocksLoading && stocksData && stocksData.rows && stocksData.rows.length">
                <div>
                    <!-- Summary KPIs -->
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-100 dark:border-slate-800 p-4 flex flex-col gap-1">
                            <span class="text-[9px] font-mono uppercase tracking-widest text-slate-400">Scored</span>
                            <span class="text-3xl font-black text-slate-800 dark:text-slate-100" x-text="stocksData.scored_count || 0"></span>
                            <span class="text-[9px] text-slate-400 font-mono" x-text="(stocksData.failed_count || 0) + ' failed to fetch'"></span>
                        </div>
                        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-100 dark:border-slate-800 p-4 flex flex-col gap-1">
                            <span class="text-[9px] font-mono uppercase tracking-widest text-slate-400">Bullish</span>
                            <span class="text-3xl font-black text-emerald-500" x-text="stocksData.counts?.bullish || 0"></span>
                            <span class="text-[9px] text-slate-400 font-mono">Overall ≥ 65</span>
                        </div>
                        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-100 dark:border-slate-800 p-4 flex flex-col gap-1">
                            <span class="text-[9px] font-mono uppercase tracking-widest text-slate-400">Neutral</span>
                            <span class="text-3xl font-black text-amber-500" x-text="stocksData.counts?.neutral || 0"></span>
                            <span class="text-[9px] text-slate-400 font-mono">45 – 64</span>
                        </div>
                        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-100 dark:border-slate-800 p-4 flex flex-col gap-1">
                            <span class="text-[9px] font-mono uppercase tracking-widest text-slate-400">Bearish</span>
                            <span class="text-3xl font-black text-rose-500" x-text="stocksData.counts?.bearish || 0"></span>
                            <span class="text-[9px] text-slate-400 font-mono">Overall &lt; 45</span>
                        </div>
                    </div>

                    <!-- Controls -->
                    <div class="flex items-center gap-3 mb-4 flex-wrap">
                        <div class="relative flex-1 min-w-[180px]">
                            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-[10px] text-slate-400" aria-hidden="true"></i>
                            <input type="text" x-model="stocksSearch" placeholder="Filter by symbol or company…"
                                   class="w-full pl-8 pr-3 py-2 rounded-lg text-xs bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-1 focus:ring-indigo-400"
                                   aria-label="Filter stocks">
                        </div>
                        <select x-model="stocksSort"
                                class="px-3 py-2 rounded-lg text-xs bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-1 focus:ring-indigo-400"
                                aria-label="Sort stocks by">
                            <option value="overall">Sort: Overall</option>
                            <option value="trend_score">Sort: Trend</option>
                            <option value="momentum_score">Sort: Momentum</option>
                            <option value="value_score">Sort: Value</option>
                            <option value="risk_score">Sort: Risk</option>
                            <option value="ret_1y">Sort: 1Y return</option>
                            <option value="ret_1m">Sort: 1M return</option>
                        </select>
                    </div>

                    <!-- Scorecard table -->
                    <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-100 dark:border-slate-800 overflow-x-auto custom-scrollbar">
                        <table class="w-full text-[11px] md:text-xs whitespace-nowrap">
                            <thead>
                                <tr class="text-left text-slate-400 border-b border-slate-100 dark:border-slate-800 sticky top-0 bg-white dark:bg-slate-900">
                                    <th class="py-2.5 px-3 font-mono uppercase tracking-wider text-[9px]">Symbol</th>
                                    <th class="py-2.5 px-2 font-mono uppercase tracking-wider text-[9px]">Company</th>
                                    <th class="py-2.5 px-2 font-mono uppercase tracking-wider text-[9px] text-right">Price</th>
                                    <th class="py-2.5 px-2 font-mono uppercase tracking-wider text-[9px] text-right">1M</th>
                                    <th class="py-2.5 px-2 font-mono uppercase tracking-wider text-[9px] text-right">6M</th>
                                    <th class="py-2.5 px-2 font-mono uppercase tracking-wider text-[9px] text-right">1Y</th>
                                    <th class="py-2.5 px-2 font-mono uppercase tracking-wider text-[9px] text-right">RSI</th>
                                    <th class="py-2.5 px-2 font-mono uppercase tracking-wider text-[9px] text-right">Trd</th>
                                    <th class="py-2.5 px-2 font-mono uppercase tracking-wider text-[9px] text-right">Mom</th>
                                    <th class="py-2.5 px-2 font-mono uppercase tracking-wider text-[9px] text-right">Val</th>
                                    <th class="py-2.5 px-2 font-mono uppercase tracking-wider text-[9px] text-right">Rsk</th>
                                    <th class="py-2.5 px-2 font-mono uppercase tracking-wider text-[9px] text-right">Overall</th>
                                    <th class="py-2.5 px-3 font-mono uppercase tracking-wider text-[9px]">Signal</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template x-for="row in stocksRows()" :key="row.symbol">
                                    <tr @click="stockDetail = row"
                                        class="border-b border-slate-50 dark:border-slate-800/50 hover:bg-slate-50 dark:hover:bg-slate-800/40 cursor-pointer transition-colors">
                                        <td class="py-2 px-3 font-mono font-bold text-slate-700 dark:text-slate-200" x-text="row.symbol"></td>
                                        <td class="py-2 px-2 text-slate-500 dark:text-slate-400 max-w-[160px] truncate" x-text="row.name || '—'"></td>
                                        <td class="py-2 px-2 text-right text-slate-600 dark:text-slate-300 font-mono" x-text="fmtNum(row.price)"></td>
                                        <td class="py-2 px-2 text-right font-mono" :class="row.ret_1m >= 0 ? 'text-emerald-500' : 'text-rose-500'" x-text="fmtPct(row.ret_1m)"></td>
                                        <td class="py-2 px-2 text-right font-mono" :class="row.ret_6m >= 0 ? 'text-emerald-500' : 'text-rose-500'" x-text="fmtPct(row.ret_6m)"></td>
                                        <td class="py-2 px-2 text-right font-mono" :class="row.ret_1y >= 0 ? 'text-emerald-500' : 'text-rose-500'" x-text="fmtPct(row.ret_1y)"></td>
                                        <td class="py-2 px-2 text-right font-mono text-slate-500" x-text="fmtNum(row.rsi, 0)"></td>
                                        <td class="py-2 px-2 text-right font-mono" :class="scoreColor(row.trend_score)" x-text="fmtNum(row.trend_score, 0)"></td>
                                        <td class="py-2 px-2 text-right font-mono" :class="scoreColor(row.momentum_score)" x-text="fmtNum(row.momentum_score, 0)"></td>
                                        <td class="py-2 px-2 text-right font-mono" :class="scoreColor(row.value_score)" x-text="fmtNum(row.value_score, 0)"></td>
                                        <td class="py-2 px-2 text-right font-mono" :class="scoreColor(row.risk_score)" x-text="fmtNum(row.risk_score, 0)"></td>
                                        <td class="py-2 px-2 text-right font-mono font-black" :class="scoreColor(row.overall)" x-text="fmtNum(row.overall, 0)"></td>
                                        <td class="py-2 px-3">
                                            <span class="px-2 py-0.5 rounded-full text-[9px] font-bold uppercase tracking-wide" :class="signalClass(row.signal)" x-text="row.signal"></span>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>

                    <p class="text-[9px] text-slate-400 dark:text-slate-600 mt-3 font-mono leading-relaxed">
                        Overall = 30% Trend + 25% Momentum + 20% Value + 25% Risk. Value &amp; Risk are ranks vs. peers.
                        Click a row for the full pillar breakdown. Decision support — not investment advice.
                    </p>
                </div>
            </template>

            <!-- Per-stock drill-down -->
            <template x-if="stockDetail">
                <div class="fixed inset-0 z-50 flex items-end md:items-center justify-center p-0 md:p-6"
                     @keydown.escape.window="stockDetail = null">
                    <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" @click="stockDetail = null"></div>
                    <div class="relative bg-white dark:bg-slate-900 rounded-t-3xl md:rounded-3xl border border-slate-200 dark:border-slate-800 w-full max-w-2xl max-h-[85vh] overflow-y-auto custom-scrollbar shadow-2xl">
                        <div class="sticky top-0 bg-white dark:bg-slate-900 border-b border-slate-100 dark:border-slate-800 px-6 py-4 flex items-center justify-between">
                            <div>
                                <div class="flex items-center gap-2">
                                    <h2 class="text-xl font-black text-slate-800 dark:text-slate-100 font-mono" x-text="stockDetail.symbol"></h2>
                                    <span class="px-2 py-0.5 rounded-full text-[9px] font-bold uppercase tracking-wide" :class="signalClass(stockDetail.signal)" x-text="stockDetail.signal"></span>
                                </div>
                                <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5" x-text="(stockDetail.name || '') + (stockDetail.sector ? ' · ' + stockDetail.sector : '')"></p>
                            </div>
                            <button @click="stockDetail = null" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-2" aria-label="Close">
                                <i class="fa-solid fa-xmark text-lg" aria-hidden="true"></i>
                            </button>
                        </div>

                        <div class="px-6 py-5 space-y-6">
                            <!-- Pillar scores -->
                            <div>
                                <h3 class="text-[9px] font-mono uppercase tracking-widest text-slate-400 mb-3">Pillar scores</h3>
                                <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
                                    <template x-for="p in [
                                        {k:'trend_score', l:'Trend'}, {k:'momentum_score', l:'Momentum'},
                                        {k:'value_score', l:'Value'}, {k:'risk_score', l:'Risk'}, {k:'overall', l:'Overall'}
                                    ]" :key="p.k">
                                        <div class="bg-slate-50 dark:bg-slate-800/50 rounded-xl p-3 text-center">
                                            <div class="text-2xl font-black" :class="scoreColor(stockDetail[p.k])" x-text="fmtNum(stockDetail[p.k], 0)"></div>
                                            <div class="text-[9px] font-mono uppercase tracking-wider text-slate-400 mt-1" x-text="p.l"></div>
                                        </div>
                                    </template>
                                </div>
                            </div>

                            <!-- Metrics grid -->
                            <div class="grid grid-cols-2 md:grid-cols-3 gap-x-6 gap-y-3 text-xs">
                                <template x-for="m in [
                                    {l:'Price', v: fmtNum(stockDetail.price) + (stockDetail.currency ? ' ' + stockDetail.currency : '')},
                                    {l:'1M / 6M / 1Y', v: fmtPct(stockDetail.ret_1m) + ' / ' + fmtPct(stockDetail.ret_6m) + ' / ' + fmtPct(stockDetail.ret_1y)},
                                    {l:'RSI(14)', v: fmtNum(stockDetail.rsi, 0)},
                                    {l:'MACD hist', v: fmtNum(stockDetail.macd_hist, 2)},
                                    {l:'SMA 50 / 200', v: fmtNum(stockDetail.sma50) + ' / ' + fmtNum(stockDetail.sma200)},
                                    {l:'Above 50 / 200', v: (stockDetail.above_sma50 ? '▲' : '▼') + ' / ' + (stockDetail.above_sma200 ? '▲' : '▼')},
                                    {l:'Golden cross', v: stockDetail.golden_cross ? 'Yes' : 'No'},
                                    {l:'Volatility (ann.)', v: fmtPct(stockDetail.volatility)},
                                    {l:'Max drawdown 1Y', v: fmtPct(stockDetail.max_dd)},
                                    {l:'Below 52w high', v: fmtPct(stockDetail.dist_from_high)},
                                    {l:'Trailing P/E', v: fmtNum(stockDetail.trailing_pe)},
                                    {l:'Forward P/E', v: fmtNum(stockDetail.forward_pe)},
                                    {l:'Price / Book', v: fmtNum(stockDetail.price_to_book)},
                                    {l:'Market cap', v: stockDetail.market_cap ? '$' + fmtNum(stockDetail.market_cap / 1e9, 1) + 'B' : '—'},
                                    {l:'Rel. strength 6M', v: fmtPct(stockDetail.rel_str_6m)}
                                ]" :key="m.l">
                                    <div class="flex flex-col">
                                        <span class="text-[9px] font-mono uppercase tracking-wider text-slate-400" x-text="m.l"></span>
                                        <span class="text-slate-700 dark:text-slate-200 font-mono" x-text="m.v"></span>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
            </template>

        </div>
    </div>
</template>
