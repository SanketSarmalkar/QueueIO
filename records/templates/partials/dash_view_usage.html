<template x-if="viewMode === 'usage'">
    <div class="flex-1 overflow-y-auto custom-scrollbar pb-24 md:pb-0">
        <div class="max-w-4xl mx-auto px-4 md:px-8 py-6 md:py-10">

            <div class="flex items-center justify-between mb-8">
                <div>
                    <h1 class="text-2xl md:text-3xl font-black text-slate-800 dark:text-slate-100 tracking-tight">API Usage</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-500 mt-1 font-mono">Gemini API — today's consumption vs. free-tier limits</p>
                </div>
                <button @click="loadUsage()"
                        class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-[10px] font-bold uppercase text-slate-500 hover:text-slate-200 hover:bg-slate-800 transition-all border border-slate-200 dark:border-slate-800"
                        aria-label="Refresh usage data">
                    <i class="fa-solid fa-rotate text-[9px]" :class="usageLoading && 'animate-spin'" aria-hidden="true"></i>
                    Refresh
                </button>
            </div>

            <!-- Loading -->
            <template x-if="usageLoading">
                <div class="space-y-4 animate-pulse" role="status" aria-label="Loading usage data">
                    <div class="h-28 bg-slate-100 dark:bg-slate-800 rounded-2xl"></div>
                    <div class="h-28 bg-slate-100 dark:bg-slate-800 rounded-2xl"></div>
                </div>
            </template>

            <template x-if="!usageLoading && usageData">
                <div>

                <!-- Today's KPIs -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                    <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-100 dark:border-slate-800 p-4 flex flex-col gap-1">
                        <span class="text-[9px] font-mono uppercase tracking-widest text-slate-400">Requests today</span>
                        <span class="text-3xl font-black text-slate-800 dark:text-slate-100" x-text="(usageData.today.total_requests || 0).toLocaleString()"></span>
                        <span class="text-[9px] text-slate-400 font-mono" x-text="'of ' + (usageData.limits?.rpd || 1500).toLocaleString() + ' limit'"></span>
                    </div>
                    <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-100 dark:border-slate-800 p-4 flex flex-col gap-1">
                        <span class="text-[9px] font-mono uppercase tracking-widest text-slate-400">Tokens today</span>
                        <span class="text-3xl font-black text-indigo-500" x-text="(usageData.today.total_tokens || 0).toLocaleString()"></span>
                        <span class="text-[9px] text-slate-400 font-mono">of 1M limit</span>
                    </div>
                    <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-100 dark:border-slate-800 p-4 flex flex-col gap-1">
                        <span class="text-[9px] font-mono uppercase tracking-widest text-slate-400">Generate calls</span>
                        <span class="text-3xl font-black text-purple-500" x-text="(usageData.today.generate_requests || 0)"></span>
                        <span class="text-[9px] text-slate-400 font-mono" x-text="(usageData.today.generate_tokens || 0).toLocaleString() + ' tokens'"></span>
                    </div>
                    <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-100 dark:border-slate-800 p-4 flex flex-col gap-1">
                        <span class="text-[9px] font-mono uppercase tracking-widest text-slate-400">Embed calls</span>
                        <span class="text-3xl font-black text-teal-500" x-text="(usageData.today.embed_requests || 0)"></span>
                        <span class="text-[9px] text-slate-400 font-mono" x-text="(usageData.today.embed_tokens || 0).toLocaleString() + ' tokens'"></span>
                    </div>
                </div>

                <!-- Progress bars -->
                <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-100 dark:border-slate-800 p-5 mb-6 space-y-5">
                    <h2 class="text-xs font-black uppercase tracking-widest text-slate-700 dark:text-slate-300">Daily Limits (Free Tier)</h2>

                    <div>
                        <div class="flex justify-between items-baseline mb-2">
                            <span class="text-[11px] font-semibold text-slate-600 dark:text-slate-400">Requests / day</span>
                            <span class="text-[10px] font-mono text-slate-500"
                                  x-text="(usageData.today.total_requests || 0) + ' / ' + (usageData.limits?.rpd || 1500)"></span>
                        </div>
                        <div class="h-2.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden"
                             role="progressbar"
                             :aria-valuenow="Math.min(100, Math.round((usageData.today.total_requests || 0) / (usageData.limits?.rpd || 1500) * 100))"
                             aria-valuemin="0" aria-valuemax="100">
                            <div class="h-full rounded-full transition-all duration-700"
                                 :class="(usageData.today.total_requests / (usageData.limits?.rpd || 1500)) > 0.85 ? 'bg-rose-500' : 'bg-indigo-500'"
                                 :style="'width:' + Math.min(100, Math.round((usageData.today.total_requests || 0) / (usageData.limits?.rpd || 1500) * 100)) + '%'"></div>
                        </div>
                        <span class="text-[9px] font-mono text-slate-400 mt-1 block"
                              x-text="Math.min(100, Math.round((usageData.today.total_requests || 0) / (usageData.limits?.rpd || 1500) * 100)) + '% used'"></span>
                    </div>

                    <div>
                        <div class="flex justify-between items-baseline mb-2">
                            <span class="text-[11px] font-semibold text-slate-600 dark:text-slate-400">Tokens / day</span>
                            <span class="text-[10px] font-mono text-slate-500"
                                  x-text="(usageData.today.total_tokens || 0).toLocaleString() + ' / 1,000,000'"></span>
                        </div>
                        <div class="h-2.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden"
                             role="progressbar"
                             :aria-valuenow="Math.min(100, Math.round((usageData.today.total_tokens || 0) / 1000000 * 100))"
                             aria-valuemin="0" aria-valuemax="100">
                            <div class="h-full rounded-full transition-all duration-700"
                                 :class="(usageData.today.total_tokens / 1000000) > 0.85 ? 'bg-rose-500' : 'bg-purple-500'"
                                 :style="'width:' + Math.min(100, Math.round((usageData.today.total_tokens || 0) / 1000000 * 100)) + '%'"></div>
                        </div>
                        <span class="text-[9px] font-mono text-slate-400 mt-1 block"
                              x-text="Math.min(100, Math.round((usageData.today.total_tokens || 0) / 1000000 * 100)) + '% used'"></span>
                    </div>
                </div>

                <!-- Source breakdown + 7-day chart -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                    <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-100 dark:border-slate-800 p-5">
                        <h2 class="text-xs font-black uppercase tracking-widest text-slate-700 dark:text-slate-300 mb-5">Source breakdown</h2>
                        <div class="space-y-3">
                            <template x-for="[src, stats] in Object.entries(usageData.source_breakdown || {})" :key="src">
                                <div>
                                    <div class="flex justify-between items-baseline mb-1">
                                        <span class="text-[11px] font-medium text-slate-700 dark:text-slate-300 capitalize" x-text="src.replace(/_/g,' ')"></span>
                                        <span class="text-[9px] font-mono text-slate-400" x-text="stats.requests + ' req · ' + (stats.tokens || 0).toLocaleString() + ' tok'"></span>
                                    </div>
                                    <div class="h-1.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
                                        <div class="h-full bg-indigo-500 rounded-full"
                                             :style="'width:' + Math.round(stats.requests / Math.max(...Object.values(usageData.source_breakdown).map(s => s.requests)) * 100) + '%'"></div>
                                    </div>
                                </div>
                            </template>
                            <template x-if="Object.keys(usageData.source_breakdown || {}).length === 0">
                                <p class="text-[10px] text-slate-400 font-mono text-center py-4">No calls logged yet today</p>
                            </template>
                        </div>
                    </div>

                    <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-100 dark:border-slate-800 p-5">
                        <h2 class="text-xs font-black uppercase tracking-widest text-slate-700 dark:text-slate-300 mb-5">Last 7 days</h2>
                        <div class="space-y-2">
                            <template x-for="day in (usageData.daily || [])" :key="day.date">
                                <div>
                                    <div class="flex justify-between items-baseline mb-1">
                                        <span class="text-[10px] font-mono text-slate-500 dark:text-slate-400 w-14 shrink-0" x-text="day.date"></span>
                                        <span class="text-[9px] font-mono text-slate-400 ml-2 shrink-0" x-text="day.requests + ' req'"></span>
                                    </div>
                                    <div class="h-1.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
                                        <div class="h-full bg-emerald-500 rounded-full transition-all duration-700"
                                             :style="'width:' + (day.requests === 0 ? 0 : Math.max(2, Math.round(day.requests / Math.max(...(usageData.daily || []).map(d => d.requests || 0)) * 100))) + '%'"></div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                </div>
            </template>

            <!-- Empty / error state -->
            <template x-if="!usageLoading && !usageData">
                <div class="flex flex-col items-center justify-center gap-4 py-20 text-center">
                    <i class="fa-solid fa-gauge-high text-4xl text-slate-200 dark:text-slate-800" aria-hidden="true"></i>
                    <p class="text-xs font-mono text-slate-400">Could not load usage data — run python manage.py migrate first</p>
                </div>
            </template>

        </div>
    </div>
</template>
