<div
    x-show="viewMode === 'nexus'"
    class="h-full w-full bg-slate-950 relative overflow-hidden"
    style="display: none;"
    :class="{ 'block': viewMode === 'nexus' }"
    @mousemove="nexusMouseX = $event.clientX; nexusMouseY = $event.clientY"
    aria-label="Nexus entity graph"
>
    <!-- Loading overlay -->
    <div x-show="nexusLoading"
        x-transition:enter="transition ease-out duration-300"
        x-transition:leave="transition ease-in duration-500"
        class="absolute inset-0 z-50 flex items-center justify-center bg-slate-950/90 backdrop-blur-xl"
        role="status" aria-label="Initializing Nexus engine">
        <div class="flex flex-col items-center gap-6">
            <div class="relative w-20 h-20" aria-hidden="true">
                <div class="absolute inset-0 border-4 border-indigo-500/10 rounded-full"></div>
                <div class="absolute inset-0 border-4 border-t-indigo-500 rounded-full animate-spin"></div>
                <div class="absolute inset-4 border-2 border-emerald-500/20 border-b-emerald-500 rounded-full animate-[spin_2s_linear_infinite_reverse]"></div>
            </div>
            <div class="text-center space-y-2">
                <p class="text-[10px] font-black text-indigo-400 uppercase tracking-[0.4em] animate-pulse">Initializing Nexus Engine</p>
                <p class="text-[8px] font-mono text-slate-500 uppercase tracking-widest">Synthesizing Cross-Report Relationships...</p>
            </div>
        </div>
    </div>

    <!-- Hover tooltip (fixed to escape overflow) -->
    <template x-if="hoverNode && viewMode === 'nexus'">
        <div :style="`left: ${nexusMouseX + 14}px; top: ${nexusMouseY - 12}px`"
             class="fixed z-[200] pointer-events-none"
             role="tooltip">
            <div class="bg-slate-900/95 border border-slate-700/80 rounded-xl px-3 py-2 shadow-2xl backdrop-blur-sm max-w-[220px]">
                <p class="font-bold text-white text-xs leading-snug truncate" x-text="hoverNode.name"></p>
                <p class="text-[9px] font-mono uppercase tracking-wider mt-0.5"
                   :class="{
                       'text-indigo-400': hoverNode.type === 'report',
                       'text-emerald-400': hoverNode.type === 'locations',
                       'text-blue-400':    hoverNode.type === 'people',
                       'text-amber-400':   hoverNode.type === 'organizations'
                   }"
                   x-text="hoverNode.type"></p>
            </div>
        </div>
    </template>

    <!-- Search + filters (top right) -->
    <div class="absolute top-3 md:top-6 left-3 right-3 md:left-auto md:right-6 z-20 md:w-72 lg:w-96" role="search" aria-label="Search nodes">
        <div class="relative group">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-xs group-focus-within:text-indigo-400 transition-colors pointer-events-none" aria-hidden="true"></i>
            <label for="nexus-search" class="sr-only">Search nodes, entities, places</label>
            <input
                id="nexus-search"
                type="text"
                x-model="nexusQuery"
                placeholder="Search nodes, entities, places..."
                class="w-full bg-slate-900/80 backdrop-blur-md border border-slate-800 rounded-2xl py-3 pl-11 pr-10 text-[11px] font-mono text-white placeholder-slate-600 focus:ring-2 focus:ring-indigo-500/50 outline-none transition-all shadow-2xl"
                autocomplete="off"
            >
            <button x-show="nexusQuery"
                    @click="nexusQuery = ''; nexusMatches = []; nexusMatchIndex = 0"
                    class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-white transition-colors p-1"
                    aria-label="Clear search">
                <i class="fa-solid fa-xmark text-xs" aria-hidden="true"></i>
            </button>
        </div>
        <!-- Match counter + next/prev -->
        <div x-show="nexusQuery.length > 1" class="flex items-center justify-between mt-2 px-1">
            <span class="text-[9px] font-mono"
                  :class="nexusMatches.length ? 'text-indigo-400' : 'text-slate-600'"
                  x-text="nexusMatches.length
                      ? (nexusMatchIndex + 1) + ' / ' + nexusMatches.length + (nexusMatches.length !== 1 ? ' matches' : ' match')
                      : 'No matches'"
                  aria-live="polite">
            </span>
            <div x-show="nexusMatches.length > 1" class="flex gap-1">
                <button @click="nexusGoToMatch(-1)"
                        class="w-6 h-6 flex items-center justify-center bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded text-slate-400 hover:text-white transition-all"
                        aria-label="Previous match">
                    <i class="fa-solid fa-chevron-up text-[8px]" aria-hidden="true"></i>
                </button>
                <button @click="nexusGoToMatch(1)"
                        class="w-6 h-6 flex items-center justify-center bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded text-slate-400 hover:text-white transition-all"
                        aria-label="Next match">
                    <i class="fa-solid fa-chevron-down text-[8px]" aria-hidden="true"></i>
                </button>
            </div>
        </div>
        <!-- Type filter chips -->
        <div class="flex flex-wrap gap-1.5 mt-2 justify-end" role="group" aria-label="Filter node types">
            <button @click="nexusFilter.report = !nexusFilter.report"
                    :class="nexusFilter.report ? 'border-indigo-500/60 text-indigo-400 bg-indigo-500/10' : 'border-slate-700 text-slate-600'"
                    class="px-2 py-0.5 rounded-md border text-[9px] font-bold uppercase transition-all bg-slate-900/80 backdrop-blur-sm"
                    :aria-pressed="nexusFilter.report">
                Reports
            </button>
            <button @click="nexusFilter.locations = !nexusFilter.locations"
                    :class="nexusFilter.locations ? 'border-emerald-500/60 text-emerald-400 bg-emerald-500/10' : 'border-slate-700 text-slate-600'"
                    class="px-2 py-0.5 rounded-md border text-[9px] font-bold uppercase transition-all bg-slate-900/80 backdrop-blur-sm"
                    :aria-pressed="nexusFilter.locations">
                Locations
            </button>
            <button @click="nexusFilter.people = !nexusFilter.people"
                    :class="nexusFilter.people ? 'border-blue-500/60 text-blue-400 bg-blue-500/10' : 'border-slate-700 text-slate-600'"
                    class="px-2 py-0.5 rounded-md border text-[9px] font-bold uppercase transition-all bg-slate-900/80 backdrop-blur-sm"
                    :aria-pressed="nexusFilter.people">
                People
            </button>
            <button @click="nexusFilter.organizations = !nexusFilter.organizations"
                    :class="nexusFilter.organizations ? 'border-amber-500/60 text-amber-400 bg-amber-500/10' : 'border-slate-700 text-slate-600'"
                    class="px-2 py-0.5 rounded-md border text-[9px] font-bold uppercase transition-all bg-slate-900/80 backdrop-blur-sm"
                    :aria-pressed="nexusFilter.organizations">
                Orgs
            </button>
        </div>
    </div>

    <!-- Legend + stats (top left) -->
    <div class="hidden md:block absolute top-6 left-6 z-10 bg-slate-900/60 backdrop-blur-md border border-slate-800 p-4 rounded-2xl pointer-events-none" aria-label="Node legend" role="note">
        <h3 class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-3">Legend</h3>
        <div class="space-y-2">
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-indigo-400" style="box-shadow:0 0 6px #818cf8" aria-hidden="true"></span>
                <span class="text-[9px] text-slate-400 uppercase">Reports</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500" style="box-shadow:0 0 6px #10b981" aria-hidden="true"></span>
                <span class="text-[9px] text-slate-400 uppercase">Locations</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-blue-500" style="box-shadow:0 0 6px #3b82f6" aria-hidden="true"></span>
                <span class="text-[9px] text-slate-400 uppercase">People</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-amber-500" style="box-shadow:0 0 6px #f59e0b" aria-hidden="true"></span>
                <span class="text-[9px] text-slate-400 uppercase">Organizations</span>
            </div>
        </div>
        <template x-if="nexusStats.nodes > 0">
            <div class="mt-4 pt-3 border-t border-slate-800 space-y-1.5">
                <div class="flex justify-between gap-6">
                    <span class="text-[8px] text-slate-600 uppercase">Nodes</span>
                    <span class="text-[8px] font-mono text-slate-400" x-text="nexusStats.nodes"></span>
                </div>
                <div class="flex justify-between gap-6">
                    <span class="text-[8px] text-slate-600 uppercase">Links</span>
                    <span class="text-[8px] font-mono text-slate-400" x-text="nexusStats.links"></span>
                </div>
            </div>
        </template>
    </div>

    <!-- Selected node panel (bottom) -->
    <div x-show="nexusSelectedNode"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 translate-y-2"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 translate-y-0"
         x-transition:leave-end="opacity-0 translate-y-2"
         class="absolute bottom-14 md:bottom-0 left-0 right-0 z-20 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 px-4 md:px-6 py-3 md:py-4 flex items-center justify-between gap-3"
         role="status" aria-label="Selected node">
        <div class="flex items-center gap-3 min-w-0">
            <span class="w-3 h-3 rounded-full flex-shrink-0" aria-hidden="true"
                  :style="nexusSelectedNode ? { background: nexusSelectedNode.color, boxShadow: '0 0 8px ' + nexusSelectedNode.color } : {}">
            </span>
            <div class="min-w-0">
                <p class="text-sm font-bold text-white truncate" x-text="nexusSelectedNode?.name"></p>
                <p class="text-[9px] font-mono uppercase tracking-wider mt-0.5"
                   :class="{
                       'text-indigo-400':  nexusSelectedNode?.type === 'report',
                       'text-emerald-400': nexusSelectedNode?.type === 'locations',
                       'text-blue-400':    nexusSelectedNode?.type === 'people',
                       'text-amber-400':   nexusSelectedNode?.type === 'organizations'
                   }"
                   x-text="nexusSelectedNode?.type">
                </p>
            </div>
        </div>
        <div class="flex items-center gap-2 flex-shrink-0">
            <template x-if="nexusSelectedNode?.type === 'report'">
                <button @click="viewMode = 'entries'; selectItem(nexusSelectedNode.id); nexusSelectedNode = null"
                        class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white text-[10px] font-bold uppercase px-3 py-1.5 rounded-lg transition-all">
                    Open Report <i class="fa-solid fa-arrow-right text-[9px]" aria-hidden="true"></i>
                </button>
            </template>
            <button @click="nexusSelectedNode = null"
                    class="w-7 h-7 flex items-center justify-center text-slate-500 hover:text-white hover:bg-slate-800 rounded-lg transition-all"
                    aria-label="Dismiss selected node">
                <i class="fa-solid fa-xmark text-xs" aria-hidden="true"></i>
            </button>
        </div>
    </div>

    <!-- Zoom controls (bottom right) -->
    <div class="absolute bottom-20 md:bottom-6 right-3 md:right-6 z-20 flex flex-col gap-2" aria-label="Zoom controls" role="group">
        <button @click="NEXUS_ENGINE && NEXUS_ENGINE.zoom(NEXUS_ENGINE.zoom() * 1.5, 300)"
                class="w-9 h-9 flex items-center justify-center bg-slate-900/80 backdrop-blur border border-slate-700 rounded-xl text-slate-400 hover:text-white hover:border-indigo-500 transition-all font-bold shadow-lg text-base leading-none"
                aria-label="Zoom in">
            +
        </button>
        <button @click="NEXUS_ENGINE && NEXUS_ENGINE.zoom(NEXUS_ENGINE.zoom() / 1.5, 300)"
                class="w-9 h-9 flex items-center justify-center bg-slate-900/80 backdrop-blur border border-slate-700 rounded-xl text-slate-400 hover:text-white hover:border-indigo-500 transition-all font-bold shadow-lg text-base leading-none"
                aria-label="Zoom out">
            −
        </button>
        <button @click="NEXUS_ENGINE && NEXUS_ENGINE.zoomToFit(400)"
                class="w-9 h-9 flex items-center justify-center bg-slate-900/80 backdrop-blur border border-slate-700 rounded-xl text-slate-400 hover:text-white hover:border-indigo-500 transition-all shadow-lg"
                aria-label="Fit graph to view">
            <i class="fa-solid fa-compress text-xs" aria-hidden="true"></i>
        </button>
    </div>

    <div id="nexus-canvas" class="h-full w-full" aria-hidden="true"></div>
</div>
