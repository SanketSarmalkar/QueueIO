<template x-if="viewMode === 'entries' && activeItem">
    <div class="pb-24 md:pb-0">
        <!-- Reading progress bar -->
        <div class="sticky top-0 z-10 h-[3px] bg-slate-200 dark:bg-slate-800" role="progressbar" :aria-valuenow="readingProgress" aria-valuemin="0" aria-valuemax="100" aria-label="Reading progress">
            <div class="h-full bg-indigo-500 transition-[width] duration-150 ease-linear"
                 :style="`width: ${readingProgress}%`"></div>
        </div>

        <div class="max-w-3xl mx-auto px-4 md:px-8 py-6 md:py-10">
            <!-- Back + meta row -->
            <div class="flex items-center gap-3 mb-8 flex-wrap">
                <button @click="goBackToStacks()"
                        class="flex items-center gap-1.5 text-[9px] font-black text-slate-500 dark:text-slate-600 hover:text-indigo-500 uppercase tracking-widest transition-colors"
                        aria-label="Back to stacks">
                    <i class="fa-solid fa-chevron-left text-[8px]" aria-hidden="true"></i> Stacks
                </button>
                <span class="text-slate-300 dark:text-slate-800 text-xs" aria-hidden="true">/</span>
                <span class="inline-flex items-center gap-1 px-2 py-0.5 bg-indigo-500/10 border border-indigo-500/20 text-indigo-500 dark:text-indigo-400 text-[9px] font-bold rounded uppercase"
                      x-text="activeItem.category"></span>
                <template x-if="activeItem.date_display">
                    <span class="text-[9px] font-mono text-slate-400 dark:text-slate-600 ml-1"
                          x-text="activeItem.date_display + (activeItem.time_display ? ' · ' + activeItem.time_display : '')"></span>
                </template>
                <template x-if="activeItem.playlist_title">
                    <span class="text-slate-300 dark:text-slate-800 text-xs" aria-hidden="true">·</span>
                    <span class="text-[9px] font-mono text-slate-500 dark:text-slate-600 truncate max-w-[200px]"
                          x-text="activeItem.playlist_title"></span>
                </template>
            </div>

            <!-- Title + bookmark -->
            <div class="flex items-start gap-3 mb-3">
                <h1 class="flex-1 text-2xl md:text-4xl font-black text-slate-900 dark:text-white leading-[1.1]"
                    x-text="activeItem.title"></h1>
                <button @click="toggleBookmark(activeItem.id, activeItem.title)"
                        :class="bookmarkedIds[activeItem.id] ? 'text-amber-500 hover:text-amber-400' : 'text-slate-300 dark:text-slate-700 hover:text-amber-400 dark:hover:text-amber-500'"
                        class="shrink-0 mt-1 md:mt-2 transition-colors p-1 rounded-lg"
                        :aria-label="bookmarkedIds[activeItem.id] ? 'Remove bookmark' : 'Save report'">
                    <i :class="bookmarkedIds[activeItem.id] ? 'fa-solid fa-bookmark' : 'fa-regular fa-bookmark'"
                       class="text-lg md:text-xl" aria-hidden="true"></i>
                </button>
            </div>
            <p class="text-[10px] font-mono text-slate-400 dark:text-slate-600 mb-8 uppercase tracking-widest"
               x-text="'Ref: ' + activeItem.key"></p>

            <!-- Accent divider -->
            <div class="flex items-center gap-3 mb-8" aria-hidden="true">
                <div class="h-[3px] w-16 bg-indigo-500 rounded-full"></div>
                <div class="h-[1px] flex-1 bg-slate-100 dark:bg-slate-800"></div>
            </div>

            <!-- Video thumbnail -->
            <template x-if="activeItem.key">
                <div class="mb-8 rounded-xl overflow-hidden bg-slate-100 dark:bg-slate-800 shadow-sm">
                    <img :src="`https://i.ytimg.com/vi/${activeItem.key}/hqdefault.jpg`"
                         :alt="activeItem.title"
                         class="w-full object-cover"
                         loading="lazy">
                </div>
            </template>

            <!-- Entity chips -->
            <div class="flex flex-wrap gap-1.5 mb-10"
                 x-show="(activeItem.entities?.locations?.length || activeItem.entities?.people?.length || activeItem.entities?.organizations?.length)"
                 aria-label="Entities">
                <template x-for="loc in (activeItem.entities?.locations || [])">
                    <button @click="searchQuery = loc; viewMode = 'entries'; selectedPlaylistId = null"
                            class="inline-flex items-center gap-1 px-2 py-1 bg-emerald-500/8 border border-emerald-500/20 text-emerald-600 dark:text-emerald-400 text-[9px] font-bold rounded-full uppercase hover:bg-emerald-500 hover:text-white hover:border-transparent transition-all"
                            :aria-label="'Filter by location: ' + loc">
                        <i class="fa-solid fa-location-dot text-[8px]" aria-hidden="true"></i> <span x-text="loc"></span>
                    </button>
                </template>
                <template x-for="person in (activeItem.entities?.people || [])">
                    <button @click="searchQuery = person; viewMode = 'entries'; selectedPlaylistId = null"
                            class="inline-flex items-center gap-1 px-2 py-1 bg-blue-500/8 border border-blue-500/20 text-blue-600 dark:text-blue-400 text-[9px] font-bold rounded-full uppercase hover:bg-blue-500 hover:text-white hover:border-transparent transition-all"
                            :aria-label="'Filter by person: ' + person">
                        <i class="fa-solid fa-user text-[8px]" aria-hidden="true"></i> <span x-text="person"></span>
                    </button>
                </template>
                <template x-for="org in (activeItem.entities?.organizations || [])">
                    <button @click="searchQuery = org; viewMode = 'entries'; selectedPlaylistId = null"
                            class="inline-flex items-center gap-1 px-2 py-1 bg-amber-500/8 border border-amber-500/20 text-amber-600 dark:text-amber-400 text-[9px] font-bold rounded-full uppercase hover:bg-amber-500 hover:text-white hover:border-transparent transition-all"
                            :aria-label="'Filter by organisation: ' + org">
                        <i class="fa-solid fa-building text-[8px]" aria-hidden="true"></i> <span x-text="org"></span>
                    </button>
                </template>
            </div>

            <!-- Article body -->
            <article class="prose prose-slate dark:prose-invert lg:prose-lg prose-indigo">
                <template x-if="activeItem.loading">
                    <div class="space-y-4 animate-pulse" aria-label="Loading report" role="status">
                        <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-3/4"></div>
                        <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded"></div>
                        <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-5/6"></div>
                        <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-1/2"></div>
                        <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-2/3"></div>
                    </div>
                </template>
                <template x-if="!activeItem.loading">
                    <div x-html="marked.parse(activeItem.value || '')"
                         class="text-slate-700 dark:text-slate-300 selection:bg-indigo-100 dark:selection:bg-indigo-900">
                    </div>
                </template>
            </article>

            <!-- Related Reports -->
            <div x-show="relatedReports.length > 0 || relatedLoading" class="mt-14">
                <div class="flex items-center gap-3 mb-5">
                    <div class="h-[1px] w-8 bg-slate-200 dark:bg-slate-800" aria-hidden="true"></div>
                    <p class="text-[9px] font-black text-slate-400 dark:text-slate-600 uppercase tracking-[0.25em] whitespace-nowrap">
                        <i class="fa-solid fa-circle-nodes mr-1.5 text-indigo-400" aria-hidden="true"></i>Related Reports
                    </p>
                    <div class="h-[1px] flex-1 bg-slate-100 dark:bg-slate-800" aria-hidden="true"></div>
                </div>

                <!-- Skeleton while loading -->
                <div x-show="relatedLoading" class="grid grid-cols-1 sm:grid-cols-2 gap-3" aria-label="Loading related reports" role="status">
                    <div class="h-[72px] bg-slate-100 dark:bg-slate-800/60 rounded-xl animate-pulse"></div>
                    <div class="h-[72px] bg-slate-100 dark:bg-slate-800/60 rounded-xl animate-pulse"></div>
                    <div class="h-[72px] bg-slate-100 dark:bg-slate-800/60 rounded-xl animate-pulse sm:block hidden"></div>
                    <div class="h-[72px] bg-slate-100 dark:bg-slate-800/60 rounded-xl animate-pulse sm:block hidden"></div>
                </div>

                <!-- Results -->
                <div x-show="!relatedLoading" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <template x-for="rel in relatedReports" :key="rel.id">
                        <button @click="selectItem(rel.id)"
                                class="text-left p-3.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl hover:border-indigo-400/40 dark:hover:border-slate-600 hover:bg-white dark:hover:bg-slate-800/60 transition-all group"
                                :aria-label="'Open related report: ' + rel.title">
                            <div class="flex items-center gap-2 mb-1.5">
                                <span class="text-[8px] font-black uppercase px-1.5 py-0.5 rounded bg-indigo-500/10 text-indigo-500 dark:text-indigo-400"
                                      x-text="rel.category"></span>
                                <span class="text-[9px] font-mono text-slate-400 dark:text-slate-600 ml-auto" x-text="rel.date_display"></span>
                            </div>
                            <p class="text-xs font-semibold text-slate-700 dark:text-slate-300 leading-snug line-clamp-2 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors"
                               x-text="rel.title"></p>
                        </button>
                    </template>
                </div>
            </div>

            <!-- Footer -->
            <div class="mt-16 pt-6 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between text-[9px] font-mono text-slate-400 dark:text-slate-700 uppercase tracking-widest">
                <span class="flex items-center gap-2">
                    <span class="w-1.5 h-1.5 rounded-full bg-indigo-500/50" aria-hidden="true"></span>
                    End of Report
                </span>
                <span x-text="activeItem.date_display"></span>
            </div>
        </div>
    </div>
</template>

<template x-if="viewMode === 'entries' && !activeItem">
    <div class="h-full flex flex-col items-center justify-center gap-5 pb-24 md:pb-0">
        <div class="w-16 h-16 rounded-2xl bg-slate-100 dark:bg-slate-800/60 flex items-center justify-center" aria-hidden="true">
            <i class="fa-solid fa-file-lines text-2xl text-slate-300 dark:text-slate-700" aria-hidden="true"></i>
        </div>
        <div class="text-center space-y-1">
            <p class="text-[11px] font-black text-slate-400 dark:text-slate-600 uppercase tracking-[0.2em]">No Entry Selected</p>
            <p class="text-[10px] font-mono text-slate-300 dark:text-slate-800">Pick a report from the sidebar</p>
        </div>
    </div>
</template>
