<!-- Mobile sidebar backdrop -->
<div x-show="sidebarOpen && viewMode === 'entries'"
     @click="sidebarOpen = false"
     class="md:hidden fixed inset-0 bg-black/60 z-20"
     x-transition:enter="transition ease-out duration-200"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-150"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     aria-hidden="true">
</div>

<aside
    x-show="sidebarOpen && viewMode === 'entries'"
    x-transition:enter="transition ease-out duration-300"
    x-transition:enter-start="-ml-80"
    x-transition:enter-end="ml-0"
    x-transition:leave="transition ease-in duration-300"
    x-transition:leave-start="ml-0"
    x-transition:leave-end="-ml-80"
    class="fixed md:static inset-y-14 md:inset-auto left-0 w-4/5 max-w-xs md:w-80 md:max-w-none border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 flex flex-col shrink-0 transition-colors duration-300 z-30 md:z-20"
    aria-label="Report list"
>
    <div class="p-4 border-b border-slate-100 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-900/50">
        <div class="relative">
            <template x-if="searchLoading">
                <i class="fa-solid fa-circle-notch absolute left-3 top-2.5 text-indigo-400 text-xs animate-spin" aria-hidden="true"></i>
            </template>
            <template x-if="!searchLoading">
                <i class="fa-solid fa-search absolute left-3 top-2.5 text-slate-400 text-xs" :class="isSearchMode && 'text-indigo-400'" aria-hidden="true"></i>
            </template>
            <label for="sidebar-search" class="sr-only">Search reports</label>
            <input id="sidebar-search" type="text" x-model="searchQuery" placeholder="Search titles & content..."
                   class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg py-2 pl-9 pr-8 text-xs text-slate-700 dark:text-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all"
                   :class="isSearchMode && 'border-indigo-400/50 dark:border-indigo-500/40'">
            <button x-show="searchQuery.length > 0"
                    @click="searchQuery = ''; isSearchMode = false; searchResults = []"
                    class="absolute right-2 top-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors p-0.5"
                    aria-label="Clear search">
                <i class="fa-solid fa-xmark text-xs" aria-hidden="true"></i>
            </button>
        </div>
        <!-- Search mode indicator -->
        <div x-show="isSearchMode" x-transition class="mt-2 flex items-center justify-between">
            <span class="text-[9px] font-mono text-indigo-500 dark:text-indigo-400 uppercase tracking-wider">
                <i class="fa-solid fa-database mr-1" aria-hidden="true"></i>Content search
            </span>
            <span class="text-[9px] font-mono text-slate-400 dark:text-slate-600"
                  x-text="searchResults.length + ' result' + (searchResults.length !== 1 ? 's' : '')"></span>
        </div>
    </div>

    <!-- Filter tabs: All / Saved -->
    <div class="flex items-center gap-1 px-3 py-2 border-b border-slate-100 dark:border-slate-800" role="group" aria-label="Filter reports">
        <button @click="showBookmarksOnly = false"
                :class="!showBookmarksOnly ? 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200' : 'text-slate-400 dark:text-slate-600 hover:text-slate-600 dark:hover:text-slate-400'"
                class="flex items-center gap-1 px-2.5 py-1 rounded-lg text-[9px] font-black uppercase tracking-wider transition-all"
                :aria-pressed="!showBookmarksOnly">
            <i class="fa-solid fa-layer-group text-[8px]" aria-hidden="true"></i> All
        </button>
        <button @click="showBookmarksOnly = true"
                :class="showBookmarksOnly ? 'bg-amber-50 dark:bg-amber-500/10 text-amber-600 dark:text-amber-400' : 'text-slate-400 dark:text-slate-600 hover:text-slate-600 dark:hover:text-slate-400'"
                class="flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-[9px] font-black uppercase tracking-wider transition-all"
                :aria-pressed="showBookmarksOnly">
            <i class="fa-solid fa-bookmark text-[8px]" aria-hidden="true"></i> Saved
            <span x-show="Object.keys(bookmarkedIds).length > 0"
                  class="bg-amber-500/20 text-amber-600 dark:text-amber-400 text-[8px] font-mono px-1 rounded"
                  x-text="Object.keys(bookmarkedIds).length"
                  aria-label="saved count"></span>
        </button>
    </div>

    <div id="sidebar-scroll" class="flex-1 overflow-y-auto custom-scrollbar" role="list" aria-label="Reports">

        <!-- Stack loading skeleton -->
        <div x-show="stackLoading" class="space-y-px animate-pulse" aria-label="Loading records" role="status">
            <template x-for="n in [1,2,3,4,5,6,7,8]" :key="n">
                <div class="px-4 py-3.5 border-b border-slate-50 dark:border-slate-800/60">
                    <div class="flex items-center justify-between mb-2">
                        <div class="h-3 w-12 bg-slate-100 dark:bg-slate-800 rounded"></div>
                        <div class="h-3 w-16 bg-slate-100 dark:bg-slate-800 rounded"></div>
                    </div>
                    <div class="h-3 bg-slate-100 dark:bg-slate-800 rounded w-full mb-1.5"></div>
                    <div class="h-3 bg-slate-100 dark:bg-slate-800 rounded w-3/4"></div>
                </div>
            </template>
        </div>

        <!-- Items list -->
        <div x-show="!stackLoading">
            <template x-for="item in filteredItems" :key="item.id">
                <div @click="selectItem(item.id)"
                     :class="selectedId === item.id
                        ? 'bg-indigo-50 dark:bg-slate-800 border-l-[3px] border-indigo-500'
                        : 'border-l-[3px] border-transparent hover:bg-slate-50 dark:hover:bg-slate-800/40'"
                     class="px-4 py-3.5 cursor-pointer border-b border-slate-50 dark:border-slate-800/60 transition-all duration-150 group"
                     role="listitem"
                     :aria-current="selectedId === item.id ? 'true' : 'false'">
                    <div class="flex items-center justify-between mb-1.5">
                        <template x-if="bookmarkedIds[item.id]">
                            <i class="fa-solid fa-bookmark text-amber-400 text-[8px] mr-1 shrink-0" aria-label="Saved"></i>
                        </template>
                        <span class="text-[8px] font-black uppercase tracking-wider px-1.5 py-0.5 rounded"
                              :class="{
                                'bg-indigo-100 dark:bg-indigo-500/15 text-indigo-600 dark:text-indigo-400': categoryColor(item.category) === 'indigo',
                                'bg-emerald-100 dark:bg-emerald-500/15 text-emerald-600 dark:text-emerald-400': categoryColor(item.category) === 'emerald',
                                'bg-blue-100 dark:bg-blue-500/15 text-blue-600 dark:text-blue-400': categoryColor(item.category) === 'blue',
                                'bg-amber-100 dark:bg-amber-500/15 text-amber-600 dark:text-amber-400': categoryColor(item.category) === 'amber',
                                'bg-rose-100 dark:bg-rose-500/15 text-rose-600 dark:text-rose-400': categoryColor(item.category) === 'rose',
                                'bg-purple-100 dark:bg-purple-500/15 text-purple-600 dark:text-purple-400': categoryColor(item.category) === 'purple',
                              }"
                              x-text="item.category"></span>
                        <span class="text-[9px] text-slate-400 dark:text-slate-600 font-mono" x-text="item.date_display"></span>
                    </div>
                    <h4 class="text-xs font-semibold text-slate-700 dark:text-slate-300 group-hover:text-indigo-700 dark:group-hover:text-indigo-400 leading-snug line-clamp-2 transition-colors"
                        x-text="item.title"></h4>
                </div>
            </template>

            <!-- Empty bookmarks state -->
            <div x-show="showBookmarksOnly && Object.keys(bookmarkedIds).length === 0"
                 class="flex flex-col items-center justify-center gap-3 py-16 px-6 text-center">
                <i class="fa-regular fa-bookmark text-slate-300 dark:text-slate-700 text-3xl" aria-hidden="true"></i>
                <p class="text-[10px] font-mono text-slate-400 dark:text-slate-600 leading-relaxed">
                    No saved reports yet.<br>Tap the bookmark icon while reading to save.
                </p>
            </div>
        </div>

        <!-- Sentinel always in DOM so IntersectionObserver never loses its reference -->
        <div id="scroll-sentinel" class="h-1"></div>
        <div x-show="loadingMore" class="py-4 text-center" role="status">
            <span class="text-[9px] font-mono text-slate-400 dark:text-slate-700 animate-pulse uppercase tracking-widest">Loading...</span>
        </div>
    </div>
</aside>
