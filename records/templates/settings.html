{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Configuration — Queuei</title>
    <link rel="icon" type="image/png" href="{% static 'favicon.png' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen font-sans" x-data="settingsApp" x-init="init()">

    {{ settings_json|json_script:"settings-data" }}

    <!-- Header -->
    <header class="h-14 bg-slate-900 flex items-center px-6 justify-between shadow-lg border-b border-slate-800 sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <a href="/" class="flex items-center gap-3">
                <img src="{% static 'favicon.png' %}" alt="Logo" class="w-9 h-9 rounded-lg object-cover border border-slate-700/50">
                <span class="font-black tracking-tighter text-lg uppercase text-white">Queue <span class="text-indigo-400">IO</span></span>
            </a>
        </div>
        <div class="flex items-center gap-6">
            <nav class="flex items-center gap-1">
                <a href="/" class="px-3 py-1 rounded text-[10px] font-bold uppercase text-slate-400 hover:text-white transition-all">Dashboard</a>
                <span class="px-3 py-1 rounded text-[10px] font-bold uppercase bg-slate-800 text-indigo-400">
                    <i class="fa-solid fa-sliders mr-1 text-[9px]"></i>Settings
                </span>
            </nav>
            <a href="{% url 'logout' %}" class="flex items-center gap-2 text-slate-400 hover:text-red-400 transition-colors text-[10px] font-mono uppercase border-l border-slate-700 pl-6">
                <i class="fa-solid fa-power-off"></i> Logout
            </a>
        </div>
    </header>

    <div class="max-w-5xl mx-auto px-6 py-10">

        <!-- Page title -->
        <div class="mb-8 flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-black uppercase tracking-tighter text-white">System Configuration</h1>
                <p class="text-slate-500 text-xs font-mono mt-1">Pipeline settings stored in the database — changes take effect on the next pipeline run.</p>
            </div>
            <button @click="showAddModal = true"
                    class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white text-[10px] font-black uppercase tracking-widest px-4 py-2 rounded-lg transition-all">
                <i class="fa-solid fa-plus"></i> New Setting
            </button>
        </div>

        <!-- Toast -->
        <div x-show="toast" x-transition
             :class="toast && toast.type === 'error' ? 'bg-red-900/80 border-red-700 text-red-200' : 'bg-emerald-900/80 border-emerald-700 text-emerald-200'"
             class="fixed top-4 right-4 z-50 border px-5 py-3 rounded-lg text-xs font-bold shadow-2xl backdrop-blur"
             x-text="toast ? toast.msg : ''">
        </div>

        <!-- Core Settings -->
        <section class="mb-10">
            <h2 class="text-[10px] font-black uppercase tracking-[0.2em] text-indigo-400 mb-3 flex items-center gap-2">
                <i class="fa-solid fa-microchip"></i> Core Pipeline Settings
            </h2>
            <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
                <template x-for="s in coreSettings" :key="s.key">
                    <div class="border-b border-slate-800 last:border-b-0">
                        <!-- View row -->
                        <div x-show="editingKey !== s.key" class="flex items-start gap-4 px-5 py-4 group">
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="text-xs font-black text-white font-mono" x-text="s.key"></span>
                                    <span class="text-[8px] font-black px-1.5 py-0.5 bg-indigo-500/20 text-indigo-400 rounded uppercase tracking-wider">CORE</span>
                                </div>
                                <p class="text-[10px] text-slate-500 mb-2" x-text="s.description"></p>
                                <div class="bg-slate-800 rounded px-3 py-2 font-mono text-xs text-slate-300 break-all"
                                     x-text="s.value || '—'"></div>
                            </div>
                            <div class="flex gap-2 shrink-0 pt-1">
                                <button @click="startEdit(s)"
                                        class="text-slate-500 hover:text-indigo-400 transition-colors text-xs px-2 py-1 rounded hover:bg-slate-800">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                </button>
                            </div>
                        </div>
                        <!-- Edit row -->
                        <div x-show="editingKey === s.key" x-transition class="px-5 py-4 bg-slate-800/50">
                            <div class="flex items-center gap-2 mb-3">
                                <span class="text-xs font-black text-indigo-400 font-mono" x-text="s.key"></span>
                                <span class="text-[8px] font-black px-1.5 py-0.5 bg-indigo-500/20 text-indigo-400 rounded uppercase tracking-wider">CORE</span>
                            </div>
                            <p class="text-[10px] text-slate-500 mb-3" x-text="s.description"></p>
                            <textarea x-model="editForm.value" rows="3"
                                      class="w-full bg-slate-900 border border-slate-700 focus:border-indigo-500 rounded-lg px-3 py-2 text-xs font-mono text-slate-200 outline-none resize-y mb-3"
                                      placeholder="Value..."></textarea>
                            <div class="flex gap-2">
                                <button @click="saveEdit(s.key)"
                                        class="bg-indigo-600 hover:bg-indigo-500 text-white text-[10px] font-black uppercase px-4 py-1.5 rounded-lg transition-all">
                                    Save
                                </button>
                                <button @click="cancelEdit()"
                                        class="text-slate-400 hover:text-white text-[10px] font-bold uppercase px-4 py-1.5 rounded-lg hover:bg-slate-700 transition-all">
                                    Cancel
                                </button>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </section>

        <!-- Custom Settings -->
        <section x-show="customSettings.length > 0">
            <h2 class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-500 mb-3 flex items-center gap-2">
                <i class="fa-solid fa-gear"></i> Custom Settings
            </h2>
            <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
                <template x-for="s in customSettings" :key="s.key">
                    <div class="border-b border-slate-800 last:border-b-0">
                        <!-- View row -->
                        <div x-show="editingKey !== s.key" class="flex items-start gap-4 px-5 py-4 group">
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="text-xs font-black text-white font-mono" x-text="s.key"></span>
                                </div>
                                <p class="text-[10px] text-slate-500 mb-2" x-text="s.description || '—'"></p>
                                <div class="bg-slate-800 rounded px-3 py-2 font-mono text-xs text-slate-300 break-all"
                                     x-text="s.value || '—'"></div>
                            </div>
                            <div class="flex gap-2 shrink-0 pt-1">
                                <button @click="startEdit(s)"
                                        class="text-slate-500 hover:text-indigo-400 transition-colors text-xs px-2 py-1 rounded hover:bg-slate-800">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                </button>
                                <button @click="deleteSetting(s.key)"
                                        class="text-slate-600 hover:text-red-400 transition-colors text-xs px-2 py-1 rounded hover:bg-slate-800">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </div>
                        <!-- Edit row -->
                        <div x-show="editingKey === s.key" x-transition class="px-5 py-4 bg-slate-800/50">
                            <span class="text-xs font-black text-white font-mono block mb-1" x-text="s.key"></span>
                            <input x-model="editForm.description" type="text"
                                   class="w-full bg-slate-900 border border-slate-700 focus:border-indigo-500 rounded-lg px-3 py-1.5 text-xs text-slate-400 outline-none mb-2"
                                   placeholder="Description (optional)">
                            <textarea x-model="editForm.value" rows="3"
                                      class="w-full bg-slate-900 border border-slate-700 focus:border-indigo-500 rounded-lg px-3 py-2 text-xs font-mono text-slate-200 outline-none resize-y mb-3"
                                      placeholder="Value..."></textarea>
                            <div class="flex gap-2">
                                <button @click="saveEdit(s.key)"
                                        class="bg-indigo-600 hover:bg-indigo-500 text-white text-[10px] font-black uppercase px-4 py-1.5 rounded-lg transition-all">
                                    Save
                                </button>
                                <button @click="cancelEdit()"
                                        class="text-slate-400 hover:text-white text-[10px] font-bold uppercase px-4 py-1.5 rounded-lg hover:bg-slate-700 transition-all">
                                    Cancel
                                </button>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </section>
    </div>

    <!-- Add Setting Modal -->
    <div x-show="showAddModal" x-transition class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm">
        <div @click.outside="showAddModal = false"
             class="bg-slate-900 border border-slate-700 rounded-2xl p-8 w-full max-w-md shadow-2xl">
            <h3 class="text-sm font-black uppercase tracking-wider text-white mb-6 flex items-center gap-2">
                <i class="fa-solid fa-plus text-indigo-400"></i> New Setting
            </h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Key</label>
                    <input x-model="newSetting.key" type="text"
                           class="w-full bg-slate-800 border border-slate-700 focus:border-indigo-500 rounded-lg px-3 py-2 text-xs font-mono text-white outline-none uppercase"
                           placeholder="MY_SETTING_KEY">
                </div>
                <div>
                    <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Value</label>
                    <textarea x-model="newSetting.value" rows="3"
                              class="w-full bg-slate-800 border border-slate-700 focus:border-indigo-500 rounded-lg px-3 py-2 text-xs font-mono text-white outline-none resize-none"
                              placeholder="Setting value..."></textarea>
                </div>
                <div>
                    <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Description <span class="text-slate-600 normal-case font-normal">(optional)</span></label>
                    <input x-model="newSetting.description" type="text"
                           class="w-full bg-slate-800 border border-slate-700 focus:border-indigo-500 rounded-lg px-3 py-2 text-xs text-slate-300 outline-none"
                           placeholder="What this setting controls">
                </div>
            </div>
            <div class="flex gap-3 mt-6">
                <button @click="addSetting()"
                        class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white text-[10px] font-black uppercase tracking-widest py-2.5 rounded-lg transition-all">
                    Create
                </button>
                <button @click="showAddModal = false; newSetting = {key:'',value:'',description:''}"
                        class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-400 text-[10px] font-bold uppercase py-2.5 rounded-lg transition-all">
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('settingsApp', () => ({
                settings: [],
                editingKey: null,
                editForm: { value: '', description: '' },
                showAddModal: false,
                newSetting: { key: '', value: '', description: '' },
                toast: null,

                init() {
                    const raw = document.getElementById('settings-data');
                    this.settings = raw ? JSON.parse(raw.textContent) : [];
                },

                get coreSettings() {
                    return this.settings.filter(s => s.is_known);
                },
                get customSettings() {
                    return this.settings.filter(s => !s.is_known);
                },

                startEdit(s) {
                    this.editingKey = s.key;
                    this.editForm = { value: s.value, description: s.description };
                },
                cancelEdit() {
                    this.editingKey = null;
                },

                async saveEdit(key) {
                    const resp = await fetch('/settings/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
                        body: JSON.stringify({ action: 'upsert', key, value: this.editForm.value, description: this.editForm.description }),
                    });
                    const data = await resp.json();
                    if (resp.ok) {
                        const idx = this.settings.findIndex(s => s.key === key);
                        if (idx >= 0) this.settings[idx] = { ...this.settings[idx], ...data.setting };
                        this.editingKey = null;
                        this.showToast('Setting saved.');
                    } else {
                        this.showToast('Error: ' + data.message, 'error');
                    }
                },

                async deleteSetting(key) {
                    if (!confirm(`Delete "${key}"?`)) return;
                    const resp = await fetch('/settings/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
                        body: JSON.stringify({ action: 'delete', key }),
                    });
                    if (resp.ok) {
                        this.settings = this.settings.filter(s => s.key !== key);
                        this.showToast('Setting deleted.');
                    }
                },

                async addSetting() {
                    const key = this.newSetting.key.trim().toUpperCase();
                    if (!key) return;
                    const resp = await fetch('/settings/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
                        body: JSON.stringify({ action: 'upsert', key, value: this.newSetting.value, description: this.newSetting.description }),
                    });
                    const data = await resp.json();
                    if (resp.ok) {
                        const exists = this.settings.findIndex(s => s.key === key);
                        if (exists >= 0) this.settings[exists] = data.setting;
                        else this.settings.push(data.setting);
                        this.newSetting = { key: '', value: '', description: '' };
                        this.showAddModal = false;
                        this.showToast('Setting created.');
                    } else {
                        this.showToast('Error: ' + data.message, 'error');
                    }
                },

                showToast(msg, type = 'success') {
                    this.toast = { msg, type };
                    setTimeout(() => this.toast = null, 3000);
                },
            }));
        });
    </script>
</body>
</html>
